default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USER", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "password") %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "ruby_partituras_api_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("DB_TEST_NAME", "ruby_partituras_api_test") %>

production:
  <<: *default
  database: ruby_partituras_api_production
  username: ruby_partituras_api
  password: <%= ENV["RUBY_PARTITURAS_API_DATABASE_PASSWORD"] %>
